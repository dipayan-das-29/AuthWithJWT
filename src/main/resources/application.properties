spring.application.name=admin-be
server.port=8080

# PostgreSQL (override with environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/boardwith_admin}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (use "validate" with Flyway/Liquibase migrations in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
